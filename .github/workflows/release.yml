name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # The archive is an installable theme directory, not a source snapshot:
      # dist/ beside theme.json is exactly the shape the hub reads a theme from
      # on disk. So the file the hub embeds at build time and the file a user
      # extracts into <themes>/<short>/ are the same file -- and this release is
      # what a third-party theme should look like when it ships.
      - run: tar czf theme.tar.gz dist theme.json
      - run: sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      # A manual dispatch builds and packages without publishing, so the whole
      # path can be exercised without cutting a release. gh ships on the runner,
      # keeping a third-party action out of the contents:write step.
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
