name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or a linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hub embeds this theme by cloning a tag of it -- whichever one the
  # hub's own web-theme.version names -- and building it there. So main
  # breaking no longer breaks a hub release, but a tag must be sound before
  # the hub is pointed at it: that build happens in the hub's CI, not here.
  # Releasing a theme version is two steps, tag here and bump that file there.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
