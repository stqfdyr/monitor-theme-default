name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or a linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hub embeds a released archive, never this repo's source: release.yml
  # builds a tag here and publishes theme.tar.gz, and the hub's web-theme.pin
  # names the tag plus its sha256. So main breaking cannot break a hub build --
  # but this is the only gate a tag gets, because by the time the hub sees it
  # the build already happened here. Shipping to a hub is two steps: tag here,
  # then move that pin there.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
